[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aha"
version = "0.1.0"
description = "GRPO post-training experiments (Chasing the Aha Moment)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Full training/eval stack. Linux (or WSL2) + NVIDIA GPU only; see scripts/setup_wsl.sh.
train = [
    "unsloth",
    "vllm==0.10.2",
    "transformers==4.56.2",
    "trl==0.22.2",
    "datasets",
    "bitsandbytes",
    "tqdm",
]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
