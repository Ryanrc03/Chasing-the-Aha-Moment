# Primary local target: Qwen2.5-3B-Instruct on an RTX 3060 12 GB (WSL2).
# Base reward only ("GRPO (base reward)" column in the report).
_base_: base.yaml
run_name: qwen3b_base

model:
  name: unsloth/Qwen2.5-3B-Instruct
  gpu_memory_utilization: 0.55
  # Standard checkpointing instead of Unsloth's CPU-offload variant: under WSL2 (no pinned
  # memory) the offload costs ~35% per step (26 s -> 17 s measured, 6 steps, 4 generations).
  gradient_checkpointing: true

reward:
  match: relaxed                # "$18" == "18"; cleaner signal than exact string match

train:
  output_dir: outputs/qwen3b_base
  num_generations: 6            # decode is batch-parallel: 4 -> 8 generations costs ~1 s/step
  max_steps: 500                # ~17-21 s/step measured on the 3060 -> ~2.5-3 h
  save_steps: 100

eval:
  datasets: [gsm8k_test, aime2024, aime2025]
