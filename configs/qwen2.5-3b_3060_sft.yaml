# SFT baseline for the GRPO-vs-SFT comparison: same model, same LoRA (r=32, all projections),
# trained on the GSM8K train split with gold solutions rewritten into the XML format.
_base_: qwen2.5-3b_3060.yaml
run_name: qwen3b_sft

sft:
  output_dir: outputs/qwen3b_sft
  learning_rate: 2.0e-4
  num_train_epochs: 1          # 7,473 examples / (4 x 4) = ~467 optimizer steps
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 1024
  warmup_ratio: 0.05
  logging_steps: 10

eval:
  lora_path: outputs/qwen3b_sft/lora
  datasets: [gsm8k_test, aime2024, aime2025]
